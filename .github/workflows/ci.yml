name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Unit tests
        run: pytest
      - name: Reproduce the analysis
        run: policy-risk --out /tmp/reports && python -c "import json; json.load(open('/tmp/reports/metrics.json'))"
